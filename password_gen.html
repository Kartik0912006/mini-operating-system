<!DOCTYPE html>
<html>
<head>
    <title>Password Generator - Mini OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="brand">🖥️ Mini OS</div>
        <div class="nav-links"><a href="/">Home</a></div>
    </div>
    <div class="page-container">
        <h1>Password Generator</h1>
        <div class="card">
            <form method="POST">
                <label>Password Length:</label>
                <input type="number" name="length" min="4" max="32" value="12">
                <button type="submit">Generate</button>
            </form>
            {% if password %}
                <div class="result-box">{{ password }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
