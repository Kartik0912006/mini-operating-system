<!DOCTYPE html>
<html>
<head>
    <title>Calculator - Mini OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="brand">🖥️ Mini OS</div>
        <div class="nav-links"><a href="/">Home</a></div>
    </div>
    <div class="page-container">
        <h1>Calculator</h1>
        <div class="card">
            <form method="POST">
                <input type="number" name="num1" placeholder="First number">
                <select name="op">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
                <input type="number" name="num2" placeholder="Second number">
                <button type="submit">Calculate</button>
            </form>
            {% if result is defined %}
                <div class="result-box">Result: {{ result }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
